alias: Garden Door Heating Pause
description: >-
  Open-window/door detection for the living room garden doors: pauses living
  room heating when the doors are open, and resumes it when they close again
  (within schedule). Includes a self-healing safety-net check for missed
  edge triggers. Split out from the old monolithic "House warming"
  automation for isolation/traceability - see README.md. Uses shared scripts
  script.pause_livingroom_heating and script.resume_livingroom_heating.
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.backdoors_garden
    from:
      - 'off'
    to:
      - 'on'
    id: Garden doors open
    for:
      hours: 0
      minutes: 2
      seconds: 0
  - trigger: state
    entity_id:
      - binary_sensor.backdoors_garden
    id: Garden doors closed
    for:
      hours: 0
      minutes: 1
      seconds: 0
    from:
      - 'on'
    to:
      - 'off'
  - trigger: time_pattern
    minutes: '/5'
    id: Garden doors safety check
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - Garden doors open
          - condition: state
            entity_id: climate.virtual_thermostat_living_room
            state:
              - heat
        sequence:
          - action: script.pause_livingroom_heating
            data: {}
        alias: Stop heating the livingroom when doors are open
      - conditions:
          - condition: trigger
            id:
              - Garden doors closed
          - condition: state
            entity_id: input_boolean.garden_heating_paused
            state: 'on'
          - condition: time
            before: '20:00:00'
        sequence:
          - action: script.resume_livingroom_heating
            data: {}
        alias: Resume heating the livingroom when doors are closed (within schedule)
      - conditions:
          - condition: trigger
            id:
              - Garden doors closed
          - condition: state
            entity_id: input_boolean.garden_heating_paused
            state: 'on'
          - condition: time
            after: '20:00:00'
        sequence:
          - action: climate.set_temperature
            metadata: {}
            target:
              entity_id: climate.virtual_thermostat_living_room
            data:
              temperature: 10
          - action: climate.set_hvac_mode
            metadata: {}
            target:
              entity_id: climate.virtual_thermostat_living_room
            data:
              hvac_mode: 'off'
          - action: input_boolean.turn_off
            metadata: {}
            target:
              entity_id: input_boolean.garden_heating_paused
            data: {}
        alias: Doors closed after schedule stop - keep living room off
      - conditions:
          - condition: trigger
            id:
              - Garden doors safety check
          - condition: state
            entity_id: binary_sensor.backdoors_garden
            state: 'on'
          - condition: state
            entity_id: climate.virtual_thermostat_living_room
            state: heat
        sequence:
          - action: script.pause_livingroom_heating
            data: {}
        alias: Safety net - stop heating if doors still open (missed edge trigger)
    continue_on_error: true
mode: queued
max: 10
