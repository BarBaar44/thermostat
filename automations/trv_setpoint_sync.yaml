alias: TRV Setpoint Sync
description: >-
  Keeps the physical TRVs (and the central heating boiler) in sync with the
  per-room virtual thermostats. Only the room that currently drives the boiler
  (the Tier 1 winner reported by sensor.delta_temperature) gets the +1C
  overshoot buffer; every other room gets its exact target. See README.md.
triggers:
  - trigger: state
    entity_id:
      - climate.virtual_thermostat_living_room
      - climate.virtual_thermostat_room_gijs
      - climate.virtual_thermostat_sports_room
      - climate.virtual_thermostat_office
      - climate.virtual_thermostat_master_bedroom
      - climate.virtual_thermostat_room_tim
    attribute: temperature
    id: Setpoint change
  - trigger: state
    entity_id: sensor.delta_temperature
    id: Winner change
conditions:
  - alias: On a delta sensor update, only continue when the winning room changed to a real room
    condition: template
    value_template: >-
      {% if trigger.id != 'Winner change' %}
        true
      {% else %}
        {% set old = (trigger.from_state.state | from_json).area
             if trigger.from_state is not none and trigger.from_state.state[:1] == '{' else none %}
        {% set new = (trigger.to_state.state | from_json).area
             if trigger.to_state is not none and trigger.to_state.state[:1] == '{' else none %}
        {{ new is not none and new != 'Off' and new != old }}
      {% endif %}
variables:
  overshoot_buffer: 1
  # Virtual thermostat -> the TRVs it drives. The hallway TRV is derived
  # separately below and is not part of this map.
  rooms:
    climate.virtual_thermostat_living_room:
      - climate.trv_kitchen
      - climate.trv_living_room_rear
      - climate.trv_living_room_front
    climate.virtual_thermostat_room_gijs:
      - climate.trv_room_gijs
    climate.virtual_thermostat_room_tim:
      - climate.trv_room_tim
    climate.virtual_thermostat_sports_room:
      - climate.trv_sports_room
    climate.virtual_thermostat_office:
      - climate.trv_office
    climate.virtual_thermostat_master_bedroom:
      - climate.shellyblutrv_f84477345a73
      - climate.shellyblutrv_f8447725a8d5
  winner_area: >-
    {% set raw = states('sensor.delta_temperature') %}
    {{ (raw | from_json).area if raw[:1] == '{' else 'Off' }}
  # A setpoint change only resyncs the room that changed. A winner change
  # resyncs every room, so the old winner loses its buffer and the new winner
  # gains it.
  rooms_to_sync: >-
    {{ [trigger.entity_id] if trigger.id == 'Setpoint change'
       else rooms.keys() | list }}
actions:
  - alias: Sync each virtual setpoint to its TRVs (buffer only for the Tier 1 winner)
    repeat:
      for_each: "{{ rooms_to_sync }}"
      sequence:
        - variables:
            vt: "{{ repeat.item }}"
            setpoint: "{{ state_attr(repeat.item, 'temperature') }}"
            buffer: >-
              {{ overshoot_buffer if area_name(repeat.item) == winner_area else 0 }}
        - if:
            - condition: template
              value_template: "{{ setpoint is not none }}"
          then:
            - repeat:
                for_each: "{{ rooms[vt] }}"
                sequence:
                  - alias: Only write when the TRV target actually differs (saves TRV battery)
                    if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(repeat.item, 'temperature') | float(-100) | round(1)
                             != (setpoint | float + buffer) | round(1) }}
                    then:
                      - action: climate.set_temperature
                        metadata: {}
                        target:
                          entity_id: "{{ repeat.item }}"
                        data:
                          temperature: "{{ (setpoint | float + buffer) | round(1) }}"
  - alias: Sync Virtual setpoint Living Room to Hallway TRV
    if:
      - condition: template
        value_template: >-
          {{ trigger.entity_id == 'climate.virtual_thermostat_living_room'
             and state_attr('climate.virtual_thermostat_living_room', 'temperature') is not none }}
    then:
      - action: climate.set_temperature
        metadata: {}
        target:
          entity_id: climate.trv_hallway
        data:
          temperature: >-
            {{ [state_attr('climate.virtual_thermostat_living_room',
            'temperature') - 8, 5] | max }}
  - alias: Sent the Virtual Setpoint to the CV
    action: climate.set_temperature
    metadata: {}
    target:
      entity_id: climate.thermostat_central_heating
    data:
      temperature: >-
        {{ (states('sensor.delta_temperature') | from_json).target | float(10) }}
mode: queued
max: 10
