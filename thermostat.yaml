opentherm:
  in_pin: 21
  out_pin: 22
  ch_enable: true
  dhw_enable: false
  cooling_enable: false
  otc_active: false
  ch2_active: true

  t_room: ch_room_temperature

output:
  - platform: opentherm
    t_set:
      id: t_set
      min_value: 0
      auto_max_value: true
      zero_means_zero: true
  # Both PID climates write here; only the active one is passed on to t_set
  - platform: template
    id: main_out
    type: float
    write_action:
      - if:
          condition:
            lambda: 'return !id(autotune_active);'
          then:
            - output.set_level:
                id: t_set
                level: !lambda 'return state;'
  - platform: template
    id: pid_out
    type: float
    write_action:
      - if:
          condition:
            lambda: 'return id(autotune_active);'
          then:
            - output.set_level:
                id: t_set
                level: !lambda 'return state;'

globals:
  # true while pid_climate autotunes; back to main_climate after a reboot
  - id: autotune_active
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # Safety net: autotune has no "finished" event, so hand back after 4 hours
  - id: autotune_timeout
    mode: restart
    then:
      - delay: 4h
      - switch.turn_off: autotune_mode

sensor:
  - platform: homeassistant
    name: "Temperature Sensor From Home Assistant"
    entity_id: sensor.virtual_heating_temperature
    id: ch_room_temperature
    filters: 
      # Push room temperature every second to update PID parameters
      - heartbeat: 1s 
  - platform: homeassistant
    name: "Temperature Sensor From Home Assistant"
    entity_id: sensor.temperature_living_room_temperature 
    id: pid_room_temperature
    filters: 
      # Push room temperature every second to update PID parameters
      - heartbeat: 1s 

  - platform: opentherm
    rel_mod_level:
      name: "Relative modulation level"
    ch_pressure:
      name: "Water pressure in CH circuit"
    dhw_flow_rate:
      name: "Water flow rate in DHW circuit"
    t_boiler:
      name: "Water temperature"
    t_dhw:
      name: "DHW temperature"
    t_outside:
      name: "Outside temperature"
    t_ret:
      name: "Return water temperature"
    t_dhw_set_ub:
      name: "Upper bound for adjustement of DHW setpoint"
    t_dhw_set_lb:
      name: "Lower bound for adjustement of DHW setpoint"
    max_t_set_ub:
      name: "Upper bound for adjustement of max CH setpoint"
    max_t_set_lb:
      name: "Lower bound for adjustement of max CH setpoint"
    t_dhw_set:
      name: "Domestic hot water temperature setpoint"
    max_t_set:
      name: "Maximum allowable CH water setpoint"

  - platform: pid
    name: "PID Climate Result"
    climate_id: pid_climate
    type: RESULT
  - platform: pid
    name: "PID Climate KP"
    climate_id: pid_climate
    type: KP
  - platform: pid
    name: "PID Climate KI"
    climate_id: pid_climate
    type: KI
  - platform: pid
    name: "PID Climate KD"
    climate_id: pid_climate
    type: KD

binary_sensor:
  - platform: opentherm
    fault_indication:
      name: "Fault indication"
    ch_active:
      name: "Central Heating active"
    dhw_active:
      name: "Domestic Hot Water active"
    flame_on:
      name: "Flame on"
    diagnostic_indication:
      name: "Diagnostic event"
    dhw_present:
      name: "DHW present"
    control_type_on_off:
      name: "Control type is on off"
    controller_pump_control_allowed:
      name: "Master pump control allowed"
    dhw_setpoint_transfer_enabled:
      name: "DHW setpoint transfer enabled"
    max_ch_setpoint_transfer_enabled:
      name: "CH maximum setpoint transfer enabled"
    dhw_setpoint_rw:
      name: "DHW setpoint read write"
    max_ch_setpoint_rw:
      name: "CH maximum setpoint read write"

switch:
  - platform: opentherm
    ch_enable:
      name: "Central Heating enabled"
    dhw_enable:
      name: "Domestic Hot Water enabled"
    otc_active:
      name: "Outside temperature compensation active"

  # Hands the boiler to pid_climate and starts autotune; off = back to main_climate
  - platform: template
    name: "PID Autotune Mode"
    id: autotune_mode
    lambda: 'return id(autotune_active);'
    turn_on_action:
      - globals.set:
          id: autotune_active
          value: 'true'
      - climate.pid.autotune: pid_climate
      - script.execute: autotune_timeout
    turn_off_action:
      - globals.set:
          id: autotune_active
          value: 'false'
      - script.stop: autotune_timeout

climate:
  - platform: pid
    id: main_climate
    name: "Central heating"
    heat_output: main_out
    default_target_temperature: 18
    sensor: ch_room_temperature
    control_parameters: 
      kp: 0.7
      ki: 0.003

  - platform: pid
    id: pid_climate
    name: "PID Climate Controller"
    sensor: pid_room_temperature
    default_target_temperature: 18°C
    heat_output: pid_out
    control_parameters:
      kp: 0.0
      ki: 0.0
      kd: 0.0
