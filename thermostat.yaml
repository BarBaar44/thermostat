opentherm:
  in_pin: 21
  out_pin: 22
  ch_enable: true
  dhw_enable: false
  cooling_enable: false
  otc_active: false
  ch2_active: true

  t_room: ch_room_temperature

output:
  # Fixed 0-100 degC request range; the flow limit is the "Central heating max
  # flow temperature" number below. Don't use auto_max_value or the boiler's
  # panel maximum as the limit: on this ATAG auto_max_value left the range at
  # 0-100 and the boiler followed requests up to its own bound of 50 degC.
  - platform: opentherm
    t_set:
      id: t_set
      min_value: 0
      max_value: 100
      zero_means_zero: true
  # What the PID drives: its output (0-1) times the flow limit. The PID output
  # is a fraction of the limit, so a lower limit also means gentler heating
  # with the same Kp and Ki; to keep the old response, scale Kp, Ki and Kd by
  # old limit / new limit. 0 stays 0 (boiler off).
  - platform: template
    id: ch_flow_request
    type: float
    write_action:
      - output.set_level:
          id: t_set
          level: !lambda |-
            float limit = id(max_flow).state;
            if (isnan(limit)) limit = 40;
            return state * limit / 100.0;

script:
  - id: apply_pid_params
    then:
      - climate.pid.set_control_parameters:
          id: main_climate
          kp: !lambda 'return id(main_kp).state;'
          ki: !lambda 'return id(main_ki).state;'
          kd: !lambda 'return id(main_kd).state;'

# main_climate tuning, adjustable from Home Assistant without reflashing
number:
  # Highest flow temperature the thermostat asks for. Point the integration's
  # "Boiler maximum flow temperature" field at this entity, so warm-ups with
  # different limits are kept apart and the PID advice limits follow it.
  - platform: template
    name: "Central heating max flow temperature"
    id: max_flow
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 25
    max_value: 80
    step: 0.5
  - platform: template
    name: "Central heating Kp"
    id: main_kp
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1.75
    min_value: 0
    max_value: 6
    step: 0.01
    on_value:
      - script.execute: apply_pid_params
  - platform: template
    name: "Central heating Ki"
    id: main_ki
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.0075
    min_value: 0
    max_value: 0.05
    step: 0.0001
    on_value:
      - script.execute: apply_pid_params
  - platform: template
    name: "Central heating Kd"
    id: main_kd
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 8000
    step: 10
    on_value:
      - script.execute: apply_pid_params
  # NEVER add a writable hot water setpoint: writing it (OpenTherm ID 56)
  # locks the ATAG out with C1 51 (confirmed 2026-10-12, also through the
  # OTGW; see README "Boiler lockout C1 51"). Set it on the boiler panel
  # (50 degC); the t_dhw_set sensor below shows the current value.

sensor:
  # Outdoor temperature for logging now, heating curve later
  - platform: homeassistant
    name: "Outdoor Temperature From Home Assistant"
    id: outdoor_temp
    entity_id: sensor.outdoor_temperature
  - platform: homeassistant
    name: "Temperature Sensor From Home Assistant"
    entity_id: sensor.virtual_heating_temperature
    id: ch_room_temperature
    filters: 
      # Push room temperature every second to update PID parameters
      - heartbeat: 1s 

  - platform: opentherm
    rel_mod_level:
      name: "Relative modulation level"
    ch_pressure:
      name: "Water pressure in CH circuit"
    dhw_flow_rate:
      name: "Water flow rate in DHW circuit"
    t_boiler:
      name: "Water temperature"
    t_dhw:
      name: "DHW temperature"
    t_outside:
      name: "Outside temperature"
    t_ret:
      name: "Return water temperature"
    t_dhw_set_ub:
      name: "Upper bound for adjustement of DHW setpoint"
    t_dhw_set_lb:
      name: "Lower bound for adjustement of DHW setpoint"
    max_t_set_ub:
      name: "Upper bound for adjustement of max CH setpoint"
    max_t_set_lb:
      name: "Lower bound for adjustement of max CH setpoint"
    t_dhw_set:
      name: "Domestic hot water temperature setpoint"
    max_t_set:
      name: "Maximum allowable CH water setpoint"

  # Internal terms of main_climate
  - platform: pid
    name: "Central heating PID Result"
    climate_id: main_climate
    type: RESULT
  - platform: pid
    name: "Central heating PID Error"
    climate_id: main_climate
    type: ERROR
  - platform: pid
    name: "Central heating PID Proportional"
    climate_id: main_climate
    type: PROPORTIONAL
  - platform: pid
    name: "Central heating PID Integral"
    climate_id: main_climate
    type: INTEGRAL
  - platform: pid
    name: "Central heating PID Derivative"
    climate_id: main_climate
    type: DERIVATIVE

binary_sensor:
  - platform: opentherm
    fault_indication:
      name: "Fault indication"
    ch_active:
      name: "Central Heating active"
    dhw_active:
      name: "Domestic Hot Water active"
    flame_on:
      name: "Flame on"
    diagnostic_indication:
      name: "Diagnostic event"
    dhw_present:
      name: "DHW present"
    control_type_on_off:
      name: "Control type is on off"
    controller_pump_control_allowed:
      name: "Master pump control allowed"
    dhw_setpoint_transfer_enabled:
      name: "DHW setpoint transfer enabled"
    max_ch_setpoint_transfer_enabled:
      name: "CH maximum setpoint transfer enabled"
    dhw_setpoint_rw:
      name: "DHW setpoint read write"
    max_ch_setpoint_rw:
      name: "CH maximum setpoint read write"

switch:
  - platform: opentherm
    ch_enable:
      name: "Central Heating enabled"
    dhw_enable:
      name: "Domestic Hot Water enabled"
    otc_active:
      name: "Outside temperature compensation active"

climate:
  - platform: pid
    id: main_climate
    name: "Central heating"
    heat_output: ch_flow_request
    default_target_temperature: 18
    sensor: ch_room_temperature
    control_parameters: 
      kp: 1.75
      ki: 0.0075
      # Heat-only loop: a negative integral only delays the next warm-up (it
      # sank to -1 overnight while the room sat above target). Positive side
      # stays at the default 1 so cold days can still build up enough heat.
      min_integral: 0


# Fail safe: without Home Assistant the room temperature above stops
# updating, but the heartbeat keeps repeating its last value, so the PID
# would keep heating towards the last target on a frozen reading. After
# 5 minutes without an API connection the room temperature is set to
# unknown; the PID turns its output off when its sensor is NaN. When Home
# Assistant connects again it sends the current value and the PID resumes.
# (The API's reboot_timeout, 15 min by default, also ends it, unless set
# to 0s.)
interval:
  - interval: 30s
    then:
      - lambda: |-
          static bool lost = false;
          static uint32_t lost_since = 0;
          if (api::global_api_server->is_connected()) {
            lost = false;
            return;
          }
          if (!lost) {
            lost = true;
            lost_since = millis();
          }
          if (millis() - lost_since >= 5UL * 60UL * 1000UL && !std::isnan(id(ch_room_temperature).state)) {
            ESP_LOGW("failsafe", "No Home Assistant for 5 min: room temperature unknown, heating stops");
            id(ch_room_temperature).publish_state(NAN);
          }
