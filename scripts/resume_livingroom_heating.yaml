alias: Resume Living Room Heating
description: >-
  Restores the living room heating state saved by
  script.pause_livingroom_heating (from input_text.livingroom_heating_snapshot)
  and clears input_boolean.garden_heating_paused. If the snapshot is missing or
  unreadable (never taken, already cleared, or lost), falls back to putting the
  virtual thermostat back into heat at 18 C and raises a persistent
  notification instead of silently leaving the living room cold. Used when the
  garden doors close again while still within the daily heating schedule.
  Extracted from duplicated inline logic in automations/house_warming.yaml (now
  deprecated) - see README.md.
sequence:
- variables:
    # Single expression so Home Assistant returns a native dict (or none),
    # not a string. from_json's default arg swallows 'unknown'/'' and any
    # malformed value, returning none -> the default branch below.
    snapshot: "{{ states('input_text.livingroom_heating_snapshot') | from_json(none) }}"
- choose:
  - alias: Snapshot present - restore it
    conditions:
    - condition: template
      value_template: "{{ snapshot is mapping and snapshot.vt_temp is number }}"
    sequence:
    - alias: Put the virtual thermostat back into its saved mode
      action: climate.set_hvac_mode
      target:
        entity_id: climate.virtual_thermostat_living_room
      data:
        hvac_mode: "{{ snapshot.vt_mode if snapshot.vt_mode in ['heat', 'off'] else 'heat' }}"
    - alias: Restore the virtual thermostat target
      action: climate.set_temperature
      target:
        entity_id: climate.virtual_thermostat_living_room
      data:
        temperature: "{{ snapshot.vt_temp | float }}"
    - alias: Restore TRV Living Room Front
      action: climate.set_temperature
      target:
        entity_id: climate.trv_living_room_front
      data:
        temperature: "{{ snapshot.front | default(snapshot.vt_temp + 1, true) | float }}"
    - alias: Restore TRV Kitchen
      action: climate.set_temperature
      target:
        entity_id: climate.trv_kitchen
      data:
        temperature: "{{ snapshot.kitchen | default(snapshot.vt_temp + 1, true) | float }}"
    - alias: Restore TRV Living Room Rear
      action: climate.set_temperature
      target:
        entity_id: climate.trv_living_room_rear
      data:
        temperature: "{{ snapshot.rear | default(snapshot.vt_temp + 1, true) | float }}"
    - alias: Clear the snapshot so a stale copy can't be reused
      action: input_text.set_value
      target:
        entity_id: input_text.livingroom_heating_snapshot
      data:
        value: ""
  default:
  - alias: No usable snapshot - restore a safe default
    action: climate.set_hvac_mode
    target:
      entity_id: climate.virtual_thermostat_living_room
    data:
      hvac_mode: heat
  - action: climate.set_temperature
    target:
      entity_id: climate.virtual_thermostat_living_room
    data:
      temperature: 18
  - alias: Warn that heating resumed without a snapshot
    action: persistent_notification.create
    data:
      notification_id: resume_livingroom_heating_no_snapshot
      title: Living room heating resumed without a snapshot
      message: >-
        script.resume_livingroom_heating ran but
        input_text.livingroom_heating_snapshot held no usable value (raw:
        "{{ states('input_text.livingroom_heating_snapshot') }}"). The virtual
        thermostat was put back into heat at 18 C as a fallback. This usually
        means Home Assistant restarted while heating was paused.
- alias: Clear the paused flag
  action: input_boolean.turn_off
  target:
    entity_id: input_boolean.garden_heating_paused
mode: single
icon: mdi:radiator
