alias: Pause Living Room Heating
description: >-
  Snapshots the living room heating state (the virtual thermostat's hvac_mode
  and target temperature, plus the three living-room TRV targets) into
  input_text.livingroom_heating_snapshot, then turns the living room virtual
  thermostat off and sets input_boolean.garden_heating_paused so heating can be
  resumed later. Used when the garden doors are open (open window detection),
  and by the Garden Door Heating Pause automation's safety-net check. Writes to
  a plain input_text instead of scene.create so the snapshot survives a Home
  Assistant restart. Extracted from duplicated inline logic in
  automations/house_warming.yaml (now deprecated) - see README.md.
sequence:
- alias: Snapshot the current living room heating state
  action: input_text.set_value
  target:
    entity_id: input_text.livingroom_heating_snapshot
  data:
    value: >-
      {{ {'vt_mode': states('climate.virtual_thermostat_living_room'),
      'vt_temp': state_attr('climate.virtual_thermostat_living_room', 'temperature'),
      'front': state_attr('climate.trv_living_room_front', 'temperature'),
      'kitchen': state_attr('climate.trv_kitchen', 'temperature'),
      'rear': state_attr('climate.trv_living_room_rear', 'temperature')} | to_json }}
- alias: Turn the living room virtual thermostat off
  action: climate.turn_off
  target:
    entity_id: climate.virtual_thermostat_living_room
- alias: Flag that living room heating is paused
  action: input_boolean.turn_on
  target:
    entity_id: input_boolean.garden_heating_paused
mode: single
icon: mdi:radiator-off
